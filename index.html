<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colores de Fondo</title>
    <link rel="stylesheet" href="styles.css">

    
</head>
<body>

    <div class="container">
        <h1>Colores de Fondo</h1>
        <div class="grid">
            <!-- Fila 1 (Ocupa toda la fila) -->
            <div class="color-item blue-gray span-4">Blue Gray</div>

            <!-- Fila 2 -->
            <div class="color-item cool-gray">Cool gray</div>
            <div class="color-item warm-gray">Warm Gray</div>
            <div class="color-item amber">Amber</div>
            <div class="color-item green">Green</div>

            <!-- Fila 3 -->
            <div class="color-item gray">Gray</div>
            <div class="color-item red">Red</div>
            <div class="color-item yellow">Yellow</div>
            <div class="color-item emerald">Emerald</div>

            <!-- Fila 4 -->
            <div class="color-item true-gray">True Gray</div>
            <div class="color-item orange">Orange</div>
            <div class="color-item lime">Lime</div>
            <div class="color-item teal">Teal</div>

            <!-- Fila 5 (Rose ocupa dos espacios) -->
            <div class="color-item fuchsia">Fuchsia</div>
            <div class="color-item pink">Pink</div>
            <div class="color-item rose span-2">Rose</div>

            <!-- Fila 6 -->
            <div class="color-item purple">Purple</div>
            <div class="color-item violet">Violet</div>
            <div class="color-item indigo">Indigo</div>
            <div class="color-item blue">Blue</div>

            <!-- Fila 7 (Ambos ocupan dos espacios) -->
            <div class="color-item sky span-2">Sky</div>
            <div class="color-item cyan span-2">Cyan</div>
        </div>
    </div>

</body>
</html>
